name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  leak-check:
    # Backstop for anything that skipped the pre-commit hook. Prints file:line only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: tools/leak-check.sh --all
        env:
          CURSUS_DENYLIST_TEXT: ${{ secrets.CURSUS_DENYLIST_TEXT }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cursus:ci
      - name: Build example PDFs
        run: docker run --rm -v "$PWD:/work" cursus:ci build example/*.md -o out
      - uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: out/*.pdf
      - name: Publish image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag cursus:ci "$img:latest"
          docker tag cursus:ci "$img:sha-${GITHUB_SHA::7}"
          docker push "$img:latest"
          docker push "$img:sha-${GITHUB_SHA::7}"
