name: build
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  leak-check:
    # Backstop for anything that skipped the pre-commit hook. Prints file:line only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: tools/leak-check.sh --all
        env:
          CURSUS_DENYLIST_TEXT: ${{ secrets.CURSUS_DENYLIST_TEXT }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cursus:ci
      - name: Build example PDFs
        run: docker run --rm -v "$PWD:/work" cursus:ci build example/*.md -o out
      - uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: out/*.pdf
      - name: Publish image to GHCR
        # main moves :latest; a vX.Y.Z git tag publishes an immutable X.Y.Z that consumers pin
        if: github.event_name == 'push'
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          case $GITHUB_REF in
            refs/heads/main) tags="latest sha-${GITHUB_SHA::7}" ;;
            refs/tags/v*)    tags=${GITHUB_REF_NAME#v} ;;  # no 'v': the Docker convention Dependabot sorts on
            *) exit 0 ;;
          esac
          for t in $tags; do docker tag cursus:ci "$img:$t" && docker push "$img:$t"; done
